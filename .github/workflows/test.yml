  coverage-combine:
    needs:
      [
        test-linux,
        test-windows,
        test-macos,
        linux-bash-complete,
        linux-fish-complete,
        macos-zsh-complete,
        macos-bash-complete,
        macos-fish-complete,
        windows-powershell-complete,
        windows-pwsh-complete,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for oidc authentication to codecov
    steps:
      - name: install-emacs-linux
        if: ${{ github.event.inputs.debug == 'true' }}
        run: |
          sudo apt install emacs
      - name: setup-ssh-debug
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: sp
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: "1.58.0"
      - name: Install Release Dependencies
        env:
          TEST_PYTHON: ${{ steps.sp.outputs.python-path }}
        run: |
          just setup "$TEST_PYTHON"

      - name: Get coverage files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: "*.coverage"
          merge-multiple: true

      - run: ls -la *.coverage
      - run: just coverage

      - name: Store merged coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-merged
          path: |
            .coverage
            coverage.xml
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          use_oidc: true
          files: ./coverage.xml
          verbose: true
