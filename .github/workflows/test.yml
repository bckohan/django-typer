name: Test

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    tags-ignore:
      - "*"
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/test.yml"
      - "pyproject.toml"
      - "justfile"
  workflow_call:
  workflow_dispatch:
    inputs:
      debug:
        description: "Open ssh debug session."
        required: true
        default: false
        type: boolean
  schedule:
    # Every Sunday at 9:00 AM Los Angeles time.
    # GitHub cron is UTC; 09:00 PT == 17:00 UTC (PST).
    - cron: "0 17 * * 0"

env:
  ENABLE_CI_ONLY_TESTS: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Django 5.2
          - python-version: "3.11"
            django-version: "dj52"
            dependencies: "lowest-direct"

          - python-version: "3.12"
            django-version: "dj52"
            dependencies: "highest"

          - python-version: "3.13"
            django-version: "dj52"
            dependencies: "highest"

          - python-version: "3.14"
            django-version: "dj52"
            dependencies: "highest"

          - python-version: "3.15"
            django-version: "dj52"
            dependencies: "highest"

          # Django 6.1
          - python-version: "3.12"
            django-version: "dj61"
            dependencies: "lowest-direct"

          - python-version: "3.13"
            django-version: "dj61"
            dependencies: "highest"

          - python-version: "3.14"
            django-version: "dj61"
            dependencies: "highest"

          - python-version: "3.15"
            django-version: "dj61"
            dependencies: "highest"
    env:
      COVERAGE_FILE: py${{ matrix.python-version }}-linux-${{ matrix.django-version }}.coverage
      ENV_FILE: py${{ matrix.python-version }}-linux-${{ matrix.django-version }}
      TEST_PYTHON_VERSION: ${{ matrix.python-version }}
      TEST_DJANGO_VERSION: ${{ matrix.django-version }}
      DEPENDENCY_RESOLUTION: ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: sp
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: install-emacs-linux
        if: ${{ github.event.inputs.debug == 'true' }}
        run: |
          sudo apt install emacs
      - name: setup-ssh-debug
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113
        timeout-minutes: 60
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: "1.58.0"
      - name: Run Unit Tests
        shell: bash
        env:
          TEST_PYTHON: ${{ steps.sp.outputs.python-path }}
        run: |
          just test-all -p "$TEST_PYTHON" --group "$TEST_DJANGO_VERSION" --resolution "$DEPENDENCY_RESOLUTION"
      - name: Store coverage files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.COVERAGE_FILE }}
          path: ${{ env.COVERAGE_FILE }}
      - name: Store env files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.ENV_FILE }}
          path: requirements-test*.txt

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
        django-version:
          - "dj52" # April 2028
          - "dj61" # April 2027
        dependencies:
          - "lowest-direct"
          - "highest"
        exclude:
          - python-version: "3.11"
            dependencies: "highest"
          - python-version: "3.15"
            dependencies: "lowest-direct"
          - python-version: "3.15"
            django-version: "dj52"
          - python-version: "3.11"
            django-version: "dj61"

    env:
      COVERAGE_FILE: py${{ matrix.python-version }}-windows-${{ matrix.django-version }}.coverage
      ENV_FILE: py${{ matrix.python-version }}-windows-${{ matrix.django-version }}-env
      TEST_PYTHON_VERSION: ${{ matrix.python-version }}
      TEST_DJANGO_VERSION: ${{ matrix.django-version }}
      DEPENDENCY_RESOLUTION: ${{ matrix.dependencies }}
      WINPTY_ROOT: ${{ github.workspace }}\winpty-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: sp
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: setup-ssh-debug
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113
      - name: install-vim-windows
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: "1.58.0"
      - name: Run Unit Tests
        env:
          TEST_PYTHON: ${{ steps.sp.outputs.python-path }}
        run: |
          just test-all -p $env:TEST_PYTHON --group $env:TEST_DJANGO_VERSION --resolution $env:DEPENDENCY_RESOLUTION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Store coverage files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.COVERAGE_FILE }}
          path: ${{ env.COVERAGE_FILE }}
      - name: Store env files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.ENV_FILE }}
          path: requirements-test*.txt

